name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  dbgate:
    runs-on: ubuntu-latest
    # The same major version as the Supabase project. The tests set the
    # database up with infra/supabase-setup.sql and then act as the gateway's
    # role and as a visitor.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: dbgate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dbgate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build --tag ag-dbgate .

  render:
    runs-on: ubuntu-latest
    # The browser check for real: the launcher, the image, gVisor and a
    # browser, set up as on the server and run against the small apps in
    # render/fixtures. The browser starts under gVisor only, so this also
    # shows that the pinned gVisor and the pinned browser still fit together.
    env:
      TEST_RENDER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: sudo infra/install-gvisor.sh
      - run: docker build --tag ag-render:latest render
      - run: sudo install -D -m 644 infra/sandbox.conf /etc/app-generator/sandbox.conf
      - run: npm ci
        working-directory: orchestrator
      - run: npx vitest run test/render.container.test.ts
        working-directory: orchestrator

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
