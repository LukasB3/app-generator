<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Apps name the fonts of the device they are opened on. This container has
  none of them, and without these lines "system-ui" comes out as a typewriter
  face. Roboto is what an Android phone shows for it.
-->
<fontconfig>
  <alias binding="same"><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>ui-sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="same"><family>ui-serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
