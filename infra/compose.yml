# Long-running containers and the two networks. Job containers are started by
# the orchestrator and join `ag-sandbox`, which has no route to the internet:
# the key proxy and the database gateway are the only things they can reach.
name: app-generator

services:
  proxy:
    build:
      context: ../orchestrator
      dockerfile: proxy.Dockerfile
    image: ag-proxy:latest
    container_name: ag-proxy
    restart: unless-stopped
    env_file:
      - /etc/app-generator/proxy.env
      - /etc/app-generator/anthropic.env
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 256m
    networks: [sandbox, egress]
    # Host loopback only: the orchestrator screens prompts through the proxy
    # with a job token, like a sandbox would.
    ports: ['127.0.0.1:8788:8080']

  # Creates and removes the tables of generated apps. It holds the only
  # database credential on this server. Job containers reach its tools, which
  # only write down what an agent asks for; the orchestrator reaches the rest
  # over host loopback.
  dbgate:
    build: ../dbgate
    image: ag-dbgate:latest
    container_name: ag-dbgate
    restart: unless-stopped
    env_file:
      - /etc/app-generator/dbgate.env
    environment:
      # Supabase's pooler for the project's region, and the gateway's own role
      # in the project. Neither is secret; the password is in dbgate.env.
      PGHOST: aws-1-eu-central-1.pooler.supabase.com
      PGUSER: ag_gate.sjzzdkyxadmifktilrre
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 256m
    networks: [sandbox, egress]
    ports: ['127.0.0.1:8789:8080']

  sandbox:
    build: ../sandbox
    image: ag-sandbox:latest
    profiles: [build]

  render:
    build: ../render
    image: ag-render:latest
    profiles: [build]

networks:
  sandbox:
    name: ag-sandbox
    internal: true
    # No host-side address on this bridge, so job containers cannot reach
    # services on the host itself (sshd, Caddy) through the gateway either.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress:
    name: ag-egress
