# Settings for job containers, read by /usr/local/sbin/ag-sandbox as root.
IMAGE=ag-sandbox:latest
NETWORK=ag-sandbox
RUNTIME=runc
MEMORY=1g
CPUS=1.5
PIDS=256
PROXY_URL=http://ag-proxy:8080
MODEL=claude-sonnet-5-5
JOBS_DIR=/var/lib/app-generator/jobs
RUN_AS=appgen
# The browser that opens a checked app. Its own sandbox starts under gVisor
# (runsc) only, so with any other runtime there is no browser check.
RENDER_IMAGE=ag-render:latest
RENDER_RUNTIME=runsc
RENDER_MEMORY=768m
RENDER_CPUS=1
RENDER_PIDS=256
